<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JavaScript DOM Quiz</title>
        <script src="web2.js" defer></script>
    </head>
    <body>
        <header>
            <h1>JavaScript DOM Quiz</h1>
        </header>
        <main>
            <h2>Answer the following questions</h2>
            <section class="quiz-section">
                <form class="card">
                    <h3>Which HTML element is used to create a hyperlink?</h3>
                    <input type="radio" value="link" id="link" name="answer">
                    <label for="link">a) link</label><br>
                    <input type="radio" value="a" id="a" name="answer">
                    <label for="a">b) a</label><br>
                    <input type="radio" value="href" id="href" name="answer">
                    <label for="href">c) href</label><br>
                    <input type="radio" value="url" id="url" name="answer">
                    <label for="url">d) url</label><br>
                    <p id="result"></p>


                    <h3>Which language makes a webpage interactive?</h3>
                    <input type="radio" value="HTML" name="answer2" id="html">
                    <label for="html">a)HTML</label><br>
                    <input type="radio" value="CSS" name="answer2" id="css">
                    <label for="css">b)CSS</label><br>
                    <input type="radio" value="JavaScript" name="answer2" id="js">
                    <label for="js">c)JavaScript</label><br>
                    <input type="radio" value="SQL" name="answer2" id="sql">
                    <label for="sql">d)SQL</label><br>
                    <p id="result2"></p>
                    <button id="change" type="button">Submit Answer</button>
                    <p id="score"></p>
                </form>
            </section>
        </main>
    </body>
</html>
